# Example MySQL settings for the ATH app.
#
# HOW TO USE:
# 1. Copy this file in the same .streamlit folder and name the copy: secrets.toml
# 2. Fill in your own MySQL password (and user/port if yours are different).
# 3. Never commit secrets.toml - it is already listed in .gitignore.

db_host = "localhost"
db_port = 3307
db_user = "root"
db_password = "YOUR_MYSQL_PASSWORD"
db_name = "ath"
